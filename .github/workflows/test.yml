name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step. The library has no dependencies and the suite runs on
      # node:test alone, which is the claim the README makes.
      - run: node --test
      - run: node example/receiver.js
